<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>獸醫病毒學 隨機測驗系統</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; }
        .home-link { text-decoration: none; color: #7f8c8d; font-size: 14px; font-weight: bold; background: #f0f0f0; padding: 6px 12px; border-radius: 6px; }
        .home-link:hover { background: #e0e0e0; }
        
        .screen { display: none; }
        .screen.active { display: block; }

        .btn { display: inline-block; background: #3498db; color: #fff; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 15px; transition: 0.3s; }
        .btn:hover { background: #2980b9; }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }

        .option-block { margin: 10px 0; padding: 15px; border: 2px solid #ecf0f1; border-radius: 8px; cursor: pointer; transition: 0.2s; background: #fff; }
        .option-block:hover { border-color: #bdc3c7; }
        .option-block.selected { background: #ebf5fb; border-color: #3498db; }
        .option-block.correct-ans { background: #d4edda; border-color: #c3e6cb; }
        .option-block.wrong-ans { background: #f8d7da; border-color: #f5c6cb; }

        .explanation { margin-top: 20px; padding: 20px; background: #e8f8f5; border-left: 5px solid #1abc9c; border-radius: 4px; display: none; }
        .result-item { border-bottom: 1px solid #eee; padding: 20px 0; }
        .correct-text { color: #27ae60; font-weight: bold; }
        .incorrect-text { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header-bar">
    <h1>🦠 獸醫病毒學隨機測驗</h1>
    <a href="index.html" class="home-link">🏠 回主選單</a>
    </div>

        <!-- 首頁 -->
        <div id="start-screen" class="screen active">
            <h3 style="text-align: center;">題庫已準備就緒</h3>
            <div style="text-align: center; margin-top: 30px;">
                <label for="question-count" style="font-size: 18px;">請選擇本次測驗題數：</label>
                <input type="number" id="question-count" value="20" min="1" max="500" style="padding: 8px; font-size: 16px; width: 80px; border: 1px solid #ccc; border-radius: 4px;">
                <br><br>
                <button class="btn" id="start-btn">開始測驗</button>
            </div>
        </div>

        <!-- 測驗頁面 -->
        <div id="quiz-screen" class="screen">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="question-counter" style="color: #7f8c8d;"></h3>
                <span id="subject-tag" style="background: #ecf0f1; padding: 4px 10px; border-radius: 20px; font-size: 14px;"></span>
            </div>
            <p id="question-text" style="font-size: 18px; font-weight: bold; margin-bottom: 20px;"></p>

            <div id="options-container"></div>

            <button class="btn" id="check-btn">確認答案</button>

            <div id="explanation-box" class="explanation"></div>

            <button class="btn" id="next-btn" style="display: none; background: #2ecc71;">下一題</button>
            <button class="btn" id="submit-btn" style="display: none; background: #e67e22;">完成測驗，查看結果</button>
        </div>

        <!-- 結果頁面 -->
        <div id="result-screen" class="screen">
            <h2 style="text-align: center;">測驗結束！</h2>
            <h2 id="final-score" style="text-align: center; color: #2980b9; font-size: 32px;"></h2>
            <div style="text-align: center;">
                <button class="btn" onclick="location.reload()">重新測驗</button>
            </div>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">
            <h3>作答回顧</h3>
            <div id="review-container"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
